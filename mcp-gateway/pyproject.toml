[project]
name = "arquiwiki-mcp-gateway"
version = "1.0.0"
description = "Gateway MCP de ArquiWiki: acceso al vault con permisos por rol"
requires-python = ">=3.12"
dependencies = [
    # Se fija la serie 1.x: mcp 2.x renombró FastMCP a MCPServer y cambió varias APIs.
    "mcp>=1.12,<2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
