name: arquiwiki

services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arquiwiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-arquiwiki}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tarea de una sola ejecución: crea el vault (repo git) desde kb-wiki/vault.
  vault-init:
    image: alpine/git:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    entrypoint: ["/bin/sh", "/scripts/vault-init.sh"]
    volumes:
      - ./kb-wiki/vault:/seed:ro
      - ./.runtime/vault:/vault
      - ./scripts/vault-init.sh:/scripts/vault-init.sh:ro
    restart: "no"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arquiwiki}:${POSTGRES_PASSWORD}@pgvector:5432/${POSTGRES_DB:-arquiwiki}?options=-csearch_path%3Dapp
    depends_on:
      pgvector:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  rag-service:
    build: ./kb-rag
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://${POSTGRES_USER:-arquiwiki}:${POSTGRES_PASSWORD}@pgvector:5432/${POSTGRES_DB:-arquiwiki}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      CORPUS_DIR: /vault/raw
      RESULTS_DIR: /results
    volumes:
      - ./.runtime/vault:/vault:ro
      - ./experiment/results:/results
    depends_on:
      pgvector:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RAG_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  mcp-gateway:
    build: ./mcp-gateway
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      VAULT_DIR: /vault
      WORKTREES_DIR: /worktrees
      AUDIT_LOG: /audit/gateway.jsonl
      GATEWAY_TOKEN_INGESTOR: ${GATEWAY_TOKEN_INGESTOR:?define GATEWAY_TOKEN_INGESTOR en .env}
      GATEWAY_TOKEN_CONSULTOR: ${GATEWAY_TOKEN_CONSULTOR:?define GATEWAY_TOKEN_CONSULTOR en .env}
      GATEWAY_TOKEN_AUDITOR: ${GATEWAY_TOKEN_AUDITOR:?define GATEWAY_TOKEN_AUDITOR en .env}
    volumes:
      - ./.runtime/vault:/vault
      - ./.runtime/worktrees:/worktrees
      - ./experiment/results:/audit
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
