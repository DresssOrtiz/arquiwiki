[project]
name = "arquiwiki-rag"
version = "1.0.0"
description = "KB-B de ArquiWiki: RAG con fragmentación, embeddings locales y pgvector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastembed>=0.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere pgvector real (variable TEST_DATABASE_URL)"]
